# Self-contained configuration used as a build-test smoke test for the nrf24
# component. It avoids Wi-Fi/API/secrets so it can be compiled in CI without any
# credentials, and it exercises BOTH the RX (on_receive) and TX (nrf24.send)
# code paths so the full component compiles.
#
# It targets the ESP32, the real hardware target for this component.

esphome:
  name: nrf24-test

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

external_components:
  - source:
      type: local
      path: ../components
    components: [nrf24]

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

nrf24:
  id: radio
  ce_pin: GPIO4
  csn_pin: GPIO15
  irq_pin: GPIO27
  channel: 76
  pa_level: LOW
  data_rate: 1MBPS
  tx_address: [0xDE, 0xAD, 0xC0, 0xDE, 0x01]
  rx_address: [0xDE, 0xAD, 0xC0, 0xDE, 0x01]
  rx_pipe: 1
  # RX path
  on_receive:
    then:
      - logger.log:
          format: "RX: %s"
          args: ['message.c_str()']

# TX path: periodically transmit to exercise the nrf24.send action compilation.
interval:
  - interval: 60s
    then:
      - nrf24.send:
          id: radio
          payload: "ping"
      - nrf24.send:
          id: radio
          payload: !lambda 'return "pong";'
