# Copy this file to `secrets.yaml` and fill in your own values.
# `secrets.yaml` is git-ignored so your credentials never get committed.

# Wi-Fi credentials
wifi_ssid: "your-wifi-ssid"
wifi_password: "your-wifi-password"
wifi_fallback_password: "fallback-hotspot-password"

# Home Assistant API encryption key.
# Generate one with: openssl rand -base64 32
api_encryption_key: "generate-with-openssl-rand-base64-32"
