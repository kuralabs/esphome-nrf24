[tox]
# Run with the tox-uv plugin so environments are provisioned with uv:
#   uvx --with tox-uv tox               # run all environments
#   uvx --with tox-uv tox -e validate   # fast config validation only
#   uvx --with tox-uv tox -e compile    # full firmware build
env_list =
    validate
    compile

[testenv]
description = Base environment (esphome, unpinned/latest)
deps = esphome

[testenv:validate]
description = Validate the example and test YAML configurations (fast, no toolchain download)
commands =
    esphome config {toxinidir}/examples/nrf24-receiver.yaml
    esphome config {toxinidir}/examples/nrf24-transmitter.yaml
    esphome config {toxinidir}/tests/nrf24-test.yaml

[testenv:compile]
description = Full firmware build of the self-contained test config (downloads the toolchain on first run)
commands =
    esphome compile {toxinidir}/tests/nrf24-test.yaml
